# SPDX-License-Identifier: AGPL-3.0-or-later
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Worker + D1
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID fehlen – Deploy übersprungen (siehe docs/HUMAN_STEPS.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.secrets.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.ok == 'true'
        run: pnpm --filter @ult/web build
      - name: Ensure D1 database and write its id into wrangler.jsonc
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/api
        run: node scripts/ensure-d1.mjs
      - name: Apply D1 migrations (remote)
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - name: Set worker secrets
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/api
        env:
          GH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          ALLOWED_IDS: ${{ secrets.ALLOWED_GITHUB_IDS }}
        run: |
          [ -n "$GH_CLIENT_ID" ] && echo "$GH_CLIENT_ID" | pnpm exec wrangler secret put GITHUB_CLIENT_ID || echo "::notice::GH_OAUTH_CLIENT_ID fehlt"
          [ -n "$GH_CLIENT_SECRET" ] && echo "$GH_CLIENT_SECRET" | pnpm exec wrangler secret put GITHUB_CLIENT_SECRET || echo "::notice::GH_OAUTH_CLIENT_SECRET fehlt"
          [ -n "$ALLOWED_IDS" ] && echo "$ALLOWED_IDS" | pnpm exec wrangler secret put ALLOWED_GITHUB_IDS || echo "::notice::ALLOWED_GITHUB_IDS fehlt"
      - name: Deploy worker
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler deploy --var ENVIRONMENT:production --var ENABLE_TEST_ROUTES:false
