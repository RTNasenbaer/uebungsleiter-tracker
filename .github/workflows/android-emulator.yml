# SPDX-License-Identifier: AGPL-3.0-or-later
name: Android emulator tests

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35]
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ult/web build
      - run: pnpm --filter @ult/android sync
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: apps/android/android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-reports-api${{ matrix.api-level }}
          path: apps/android/android/app/build/reports/androidTests
          retention-days: 14
