# Weekly D1 export. The repository is public → the dump is encrypted before it is stored as artifact.
name: D1 backup

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::Cloudflare-Token oder BACKUP_PASSPHRASE fehlt – Backup übersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.secrets.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - name: Export and encrypt
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/api
        run: |
          node scripts/ensure-d1.mjs
          pnpm exec wrangler d1 export DB --remote --output backup.sql
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in backup.sql -out "$GITHUB_WORKSPACE/d1-backup.sql.enc" -pass env:BACKUP_PASSPHRASE
          rm backup.sql
      - uses: actions/upload-artifact@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          name: d1-backup-${{ github.run_number }}
          path: d1-backup.sql.enc
          retention-days: 90
