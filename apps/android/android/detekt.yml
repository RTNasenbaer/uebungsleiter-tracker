# SPDX-License-Identifier: AGPL-3.0-or-later
style:
  MagicNumber:
    active: true
    ignoreAnnotated: ['Test']
    excludes: ['**/test/**', '**/androidTest/**']
    ignorePropertyDeclaration: true
    ignoreRanges: true
    ignoreCompanionObjectPropertyDeclaration: true
  ReturnCount:
    max: 4
  WildcardImport:
    active: true
complexity:
  TooManyFunctions:
    thresholdInClasses: 20
    thresholdInFiles: 20
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
  LongMethod:
    threshold: 80
naming:
  FunctionNaming:
    ignoreAnnotated: ['Test', 'Composable']
exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
