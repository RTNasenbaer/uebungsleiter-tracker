apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jlleitschuh.gradle.ktlint'
apply plugin: 'io.gitlab.arturbosch.detekt'
apply plugin: 'io.github.takahirom.roborazzi'

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace = "de.uebungsleiter.tracker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.uebungsleiter.tracker"
        // Full-screen alarm APIs: we keep 26 as minimum (skill android-alarm)
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName System.getenv('VERSION_NAME') ?: '0.1.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreProps['storeFile']) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlin {
        jvmToolchain(21)
    }
    buildFeatures {
        buildConfig true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'robolectric.pixelCopyRenderMode', 'hardware'
                maxHeapSize = '2g'
            }
        }
    }
    lint {
        abortOnError true
        warningsAsErrors false
        checkDependencies false
        disable 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion', 'OldTargetApi'
        lintConfig file('lint.xml')
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime-ktx:$workVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation "com.google.android.material:material:$materialVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    testImplementation "androidx.test:core-ktx:$androidxTestCoreVersion"
    testImplementation "androidx.test.ext:junit-ktx:$androidxJunitVersion"
    testImplementation "androidx.work:work-testing:$workVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutinesVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver:$mockWebServerVersion"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:$roborazziVersion"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-junit-rule:$roborazziVersion"
    testImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"

    androidTestImplementation "androidx.test.ext:junit-ktx:$androidxJunitVersion"
    androidTestImplementation "androidx.test:core-ktx:$androidxTestCoreVersion"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:$uiautomatorVersion"
    androidTestImplementation "com.squareup.okhttp3:mockwebserver:$mockWebServerVersion"
}

apply from: 'capacitor.build.gradle'

ktlint {
    android = true
    filter {
        exclude { it.file.path.contains('/build/') }
    }
}

detekt {
    buildUponDefaultConfig = true
    config.setFrom(files("$rootDir/detekt.yml"))
    source.setFrom(files('src/main/java', 'src/test/java', 'src/androidTest/java'))
}

roborazzi {
    outputDir = file("$rootDir/../screenshots")
}
