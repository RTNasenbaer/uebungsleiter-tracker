// Top-level build file. No Google services / Firebase (see CLAUDE.md).
buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'org.jlleitschuh.gradle:ktlint-gradle:14.2.0'
        classpath 'io.gitlab.arturbosch.detekt:detekt-gradle-plugin:1.23.8'
        classpath 'io.github.takahirom.roborazzi:roborazzi-gradle-plugin:1.79.0'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // kotlin-stdlib >= 1.8 contains the former -jdk7/-jdk8 artifacts; old transitive copies cause duplicate classes
    configurations.configureEach {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
